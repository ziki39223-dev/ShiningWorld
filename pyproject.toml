[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shining-world"
version = "1.0.0"
description = "闪亮大世界 ShiningWorld · 多支线群像剧情推演系统 MCP 调度服务"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.3,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
shining-world-sse = "shining_world.entry.cli:run_sse"
shining-world-stdio = "shining_world.entry.cli:run_stdio"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shining_world = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
